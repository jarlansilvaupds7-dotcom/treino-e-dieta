<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FitDiário">
<meta name="theme-color" content="#0e1013" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>FitDiário</title>
<style>
:root{
  --bg:#0e1013; --surface:#171a1f; --surface2:#20242b; --line:#2a2f37;
  --text:#eef1f4; --muted:#9aa3ad; --accent:#34d399; --accent-ink:#052e1f;
  --danger:#f87171; --prot:#60a5fa; --carb:#fbbf24; --fat:#f472b6;
  --st:env(safe-area-inset-top); --sb:env(safe-area-inset-bottom);
}
@media (prefers-color-scheme: light){
  :root{ --bg:#f4f5f7; --surface:#fff; --surface2:#eef0f3; --line:#dfe3e8;
    --text:#111418; --muted:#5d6670; --accent:#059669; --accent-ink:#fff;
    --danger:#dc2626; --prot:#2563eb; --carb:#d97706; --fat:#db2777; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);
  font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif;
  -webkit-text-size-adjust:100%}
body{padding-top:calc(54px + var(--st));padding-bottom:calc(76px + var(--sb));min-height:100dvh}
body.stacked{padding-bottom:calc(24px + var(--sb))}
body.has-timer main{padding-bottom:84px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select{font:inherit;color:var(--text)}

/* header */
.top{position:fixed;inset:0 0 auto 0;z-index:20;height:calc(54px + var(--st));padding:var(--st) 8px 0;
  display:flex;align-items:center;gap:4px;background:var(--bg);border-bottom:1px solid var(--line)}
@supports (backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px)){
  .top{background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
}
.top h1{flex:1;margin:0 8px;font-size:19px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#back{font-size:30px;line-height:1;width:40px;height:40px;color:var(--accent)}
.link{color:var(--accent);font-weight:600;padding:8px 10px}

main{max-width:640px;margin:0 auto;padding:14px 16px}

/* tabs */
#tabs{position:fixed;inset:auto 0 0 0;z-index:20;display:grid;grid-template-columns:repeat(4,1fr);
  padding:6px 4px calc(6px + var(--sb));background:var(--surface);border-top:1px solid var(--line)}
body.stacked #tabs{display:none}
#tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);padding:4px 0}
#tabs button.on{color:var(--accent)}
#tabs svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* building blocks */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.row{display:flex;align-items:center}
.between{justify-content:space-between}
.gap{gap:8px}
.grow{flex:1;min-width:0}
.mt{margin-top:10px}
.muted{color:var(--muted)}
.small{font-size:13px}
.center{text-align:center}
.h3{font-size:17px;font-weight:700}
.h4{font-size:15px;font-weight:650}
.big{font-size:30px;font-weight:800;letter-spacing:-.5px}
.accent{color:var(--accent)}
.section-title{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:18px 4px 8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;
  border-radius:12px;background:var(--surface2);border:1px solid var(--line);font-weight:600}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--danger);background:transparent}
.btn.ghost{background:transparent}
.btn.block{display:flex;width:100%;margin-bottom:10px}
.btn.dashed{border-style:dashed;background:transparent;color:var(--accent)}
.icon-btn{width:36px;height:36px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);font-size:17px}
.inp,select.inp{width:100%;min-height:44px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);font-size:16px;-webkit-appearance:none;appearance:none}
select.inp{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
.inp:focus{outline:2px solid var(--accent);outline-offset:-1px}
.lbl{display:block;font-size:13px;color:var(--muted);margin:10px 2px 5px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.form-grid .full{grid-column:1/-1}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.grid4 label{font-size:12px;color:var(--muted)}
.grid4 .inp{margin-top:4px;padding:8px;text-align:center;min-height:40px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 4px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 13px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);font-size:14px;white-space:nowrap}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.search{margin-bottom:4px}
.li{display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.list{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:2px 12px;margin-bottom:12px}
.li .tick{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;color:transparent;flex:none}
.li.sel .tick{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:800}
.group-h{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;padding:12px 4px 2px}
.empty{text-align:center;color:var(--muted);padding:28px 12px}
.note{border-color:var(--accent);color:var(--text)}
.sticky-foot{position:sticky;bottom:calc(10px + var(--sb));padding-top:8px}
.kv{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-size:15px}
.kv:last-of-type{border-bottom:0}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.tile{background:var(--surface2);border-radius:12px;padding:10px;text-align:center}
.tile b{display:block;font-size:19px}
.tile span{font-size:12px;color:var(--muted)}

/* workouts */
.active-banner{display:flex;align-items:center;gap:10px;border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface))}
.sets{margin-top:10px}
.set-h,.set{display:grid;grid-template-columns:40px 1fr 1fr 48px;gap:8px;align-items:center}
.set-h{font-size:12px;color:var(--muted);padding:0 0 4px;text-align:center}
.set{margin-bottom:6px}
.set .n{text-align:center;font-weight:700;color:var(--muted)}
.set .inp{text-align:center;min-height:42px;padding:6px}
.check{height:42px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);font-size:18px;font-weight:800;color:var(--muted)}
.set.done .check{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.set.done .inp{border-color:color-mix(in srgb,var(--accent) 50%,var(--line))}
.prev{font-size:13px;color:var(--muted);margin-top:6px}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);text-align:center}
.stat3 b{display:block;font-size:22px}
.stat3 span{font-size:12px;color:var(--muted)}

/* timer */
#timer{position:fixed;left:12px;right:12px;bottom:calc(74px + var(--sb));z-index:30;max-width:616px;margin:0 auto;
  background:var(--surface);border:1px solid var(--accent);border-radius:16px;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.35)}
body.stacked #timer{bottom:calc(12px + var(--sb))}
#timer[hidden]{display:none}
#tProg{position:absolute;inset:0 auto 0 0;background:color-mix(in srgb,var(--accent) 16%,transparent);width:0}
.timer-in{position:relative;display:flex;align-items:center;gap:8px;padding:8px 10px}
.timer-in b{font-size:24px;font-variant-numeric:tabular-nums;min-width:64px}
.timer-in .btn{min-height:36px;padding:0 10px}

/* diet */
.datebar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.datebar .icon-btn{font-size:26px;color:var(--accent);width:44px;height:44px}
.date-lbl{font-weight:700;font-size:17px;padding:8px 16px;border-radius:999px;background:var(--surface)}
.sum{display:flex;align-items:center;gap:16px}
.ring{position:relative;width:124px;height:124px;flex:none}
.ring svg{width:100%;height:100%}
.ring-bg{fill:none;stroke:var(--surface2);stroke-width:11}
.ring-fg{fill:none;stroke:var(--accent);stroke-width:11;stroke-linecap:round;transition:stroke-dashoffset .4s}
.ring-fg.over{stroke:var(--danger)}
.ring-txt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-txt b{font-size:26px;line-height:1}
.ring-txt span{font-size:12px;color:var(--muted)}
.sum-stats{flex:1;display:flex;flex-direction:column;gap:10px}
.sum-stats div{display:flex;justify-content:space-between;align-items:baseline}
.sum-stats b{font-size:18px}
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.macro .bar{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden;margin:5px 0 3px}
.macro .bar i{display:block;height:100%;border-radius:3px}
.macro .nm{font-size:12px;color:var(--muted)}
.macro .vl{font-size:13px;font-weight:600}
.meal-h{display:flex;align-items:center;justify-content:space-between}
.add-btn{width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:22px;font-weight:700;line-height:1}
.meal .li{padding:10px 0}
.kcal{font-weight:700;font-variant-numeric:tabular-nums}
.chip-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.prev-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}

/* charts */
.bars{display:flex;align-items:flex-end;gap:8px;height:130px;position:relative;margin-top:14px;padding-top:16px}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.bars .b i{width:100%;max-width:34px;border-radius:6px 6px 2px 2px;background:var(--accent);min-height:2px}
.bars .b i.over{background:var(--danger)}
.bars .b small{font-size:10px;color:var(--muted);margin-bottom:3px}
.bar-lbls{display:flex;gap:8px;margin-top:4px}
.bar-lbls span{flex:1;text-align:center;font-size:11px;color:var(--muted)}
.meta-line{position:absolute;left:0;right:0;border-top:1.5px dashed var(--muted);opacity:.7}
.chart{width:100%;height:auto;display:block;margin-top:8px}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .dt{fill:var(--accent)}
.chart .ct{fill:var(--muted);font-size:11px}
.chart .gl{stroke:var(--line);stroke-width:1}

#toast{position:fixed;left:50%;top:calc(64px + var(--st));transform:translate(-50%,-20px);opacity:0;z-index:50;
  background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;
  transition:.25s;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<header class="top">
  <button id="back" data-a="back" aria-label="Voltar" hidden>‹</button>

<main id="view"></main>

  <button data-a="tab" data-tab="historico"><svg viewBox="0 0 24 24"><path d="M3 21h18M6.5 17v-5M11.5 17V6M16.5 17v-8"/></svg>Histórico</button>
  <button data-a="tab" data-tab="perfil"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/></svg>Perfil</button>
</nav>

<input type="file" id="importFile" hidden>

const MEALS = [['cafe','Café da manhã'],['almoco','Almoço'],['lanche','Lanche'],['jantar','Jantar'],['ceia','Ceia']];

const GOALS = [['perder','Perder gordura (−500 kcal)',-500],['manter','Manter o peso',0],['ganhar','Ganhar massa (+300 kcal)',300]];

/* ================= Utilidades ================= */
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = (v) => { const n = parseFloat(String(v ?? '').replace(',', '.')); return isFinite(n) ? n : 0; };
const r1 = (n) => Math.round(n * 10) / 10;
const fmt = (n) => r1(n).toLocaleString('pt-BR');
const pad = (n) => String(n).padStart(2, '0');
const ymd = (d) => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseYmd = (s) => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (s, n) => { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); };
const today = () => ymd(new Date());
const dur = (ms) => { const s = Math.max(0, Math.floor(ms/1000)); const h = Math.floor(s/3600), m = Math.floor(s%3600/60); return h ? `${h}:${pad(m)}:${pad(s%60)}` : `${m}:${pad(s%60)}`; };
const norm = (s) => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
let _c = 0; const uid = () => Date.now().toString(36) + (_c++).toString(36) + Math.random().toString(36).slice(2, 5);
const clone = (o) => JSON.parse(JSON.stringify(o));

function dayLabel(s) {
  const t = today();
  if (s === t) return 'Hoje';
  if (s === addDays(t, -1)) return 'Ontem';
  if (s === addDays(t, 1)) return 'Amanhã';
  return parseYmd(s).toLocaleDateString('pt-BR', { weekday:'short', day:'2-digit', month:'short' });
}
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2200);
}

/* ================= Armazenamento ================= */
const KEY = 'fitdiario_v1';
function initialData() {
  const exercises = []; let i = 0;
  for (const [grupo, nomes] of Object.entries(DEFAULT_EX)) for (const nome of nomes) exercises.push({ id:'ex'+(i++), nome, grupo });
  const foods = DEFAULT_FOODS.map((f, i) => ({ id:'f'+i, nome:f[0], kcal:f[1], p:f[2], c:f[3], g:f[4], porcao: f[5] ? { nome:f[5], g:f[6] } : null }));
  const idOf = (n) => exercises.find(e => e.nome === n).id;
  const mk = (nome, list) => ({ id:uid(), nome, itens: list.map(([n, series, reps, descanso]) => ({ exId:idOf(n), series, reps, carga:'', descanso })) });
  const workouts = [
    mk('Treino A – Peito e Tríceps', [['Supino reto (barra)',4,'8-10',90],['Supino inclinado (halteres)',3,'10-12',90],['Crucifixo (halteres)',3,'12',60],['Tríceps corda',3,'12',60],['Tríceps testa',3,'10',60]]),
    mk('Treino B – Costas e Bíceps', [['Puxada frontal',4,'10',90],['Remada baixa',3,'10-12',90],['Remada unilateral (serrote)',3,'10',60],['Rosca direta (barra)',3,'10',60],['Rosca martelo',3,'12',60]]),
    mk('Treino C – Pernas e Ombros', [['Agachamento livre',4,'8-10',120],['Leg press 45°',3,'12',90],['Cadeira extensora',3,'12',60],['Mesa flexora',3,'12',60],['Desenvolvimento (halteres)',3,'10',90],['Elevação lateral',3,'12-15',60],['Panturrilha em pé',4,'15',45]])
  ];
  return { v:1, profile:{ configurado:false, sexo:'M', idade:30, peso:75, altura:175, atividade:1.55, objetivo:'manter', protKg:2, gordKg:0.9, metaManual:'' },
    exercises, workouts, sessions:[], active:null, foods, diary:{} };
}
function load() {
  try { const raw = localStorage.getItem(KEY); if (raw) return Object.assign(initialData(), JSON.parse(raw)); } catch (e) {}
  return initialData();
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) { toast('Erro ao salvar os dados!'); }
}
let db = load();
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

const exById = (id) => db.exercises.find(e => e.id === id);

/* ================= Cálculos ================= */
function metas() {
  const p = db.profile;
  const tmb = 10*p.peso + 6.25*p.altura - 5*p.idade + (p.sexo === 'M' ? 5 : -161);
  const tdee = tmb * p.atividade;
  const ajuste = (GOALS.find(g => g[0] === p.objetivo) || [0,0,0])[2];
  const kcal = num(p.metaManual) > 0 ? Math.round(num(p.metaManual)) : Math.round(tdee + ajuste);
  const prot = Math.round(p.protKg * p.peso), gord = Math.round(p.gordKg * p.peso);
  const carb = Math.max(0, Math.round((kcal - prot*4 - gord*9) / 4));
  return { tmb:Math.round(tmb), tdee:Math.round(tdee), ajuste, kcal:Math.max(kcal, 1), prot, gord, carb };
}
const dayEntries = (d) => db.diary[d] || [];
const totals = (list) => list.reduce((t, e) => (t.kcal += e.kcal, t.p += e.p, t.c += e.c, t.g += e.g, t), { kcal:0, p:0, c:0, g:0 });
const calc = (b, g) => ({ kcal:b.kcal*g/100, p:b.p*g/100, c:b.c*g/100, g:b.g*g/100 });
function lastSetsFor(exId) {
  for (let i = db.sessions.length - 1; i >= 0; i--) {
    const it = db.sessions[i].itens.find(x => x.exId === exId);
    if (it && it.sets.length) return it.sets;
  }
  return null;
}
const volume = (itens) => itens.reduce((v, it) => v + it.sets.reduce((s, x) => s + num(x.kg)*num(x.reps), 0), 0);

/* ================= Estado da interface ================= */
const S = { tab:'treinos', stack:[], day:today(), draft:null, pick:new Set(), q:'', grp:'Todos', open:{}, timer:null };
const cur = () => S.stack[S.stack.length - 1];
function push(page) { S.stack.push(page); render(); window.scrollTo(0, 0); }
function pop(n = 1) { for (let i = 0; i < n; i++) S.stack.pop(); render(); window.scrollTo(0, 0); }

TABS.treinos = () => {

    h += `<div class="card active-banner" data-a="openSession">
      <div class="grow"><b>Treino em andamento</b><div class="muted small">${esc(db.active.nome)} · <span id="bannerElapsed">${dur(Date.now()-db.active.inicio)}</span></div></div>
      <span class="btn sm primary">Continuar</span></div>`;
  }
  if (!db.workouts.length) h += `<div class="empty">Você ainda não tem treinos.<br>Crie o primeiro abaixo.</div>`;
  for (const w of db.workouts) {
    const grupos = [...new Set(w.itens.map(it => (exById(it.exId) || {}).grupo).filter(Boolean))].join(', ');
    const last = [...db.sessions].reverse().find(s => s.workoutId === w.id);
    let lastTxt = 'Nunca feito';
    if (last) { const d = Math.round((parseYmd(today()) - parseYmd(ymd(new Date(last.inicio)))) / 864e5); lastTxt = d === 0 ? 'Feito hoje' : d === 1 ? 'Feito ontem' : `Feito há ${d} dias`; }
    h += `<div class="card">
      <div class="h3">${esc(w.nome)}</div>

      <div class="muted small">${lastTxt}</div>
      <div class="row gap mt"><button class="btn primary grow" data-a="startWorkout" data-id="${w.id}">▶ Iniciar</button>
      <button class="btn" data-a="editWorkout" data-id="${w.id}">Editar</button></div></div>`;
  }
  h += `<button class="btn block dashed" data-a="newWorkout">+ Novo treino</button>`;
  return { title:'Treinos', html:h };
};

TABS.dieta = () => {
  const d = S.day, list = dayEntries(d), t = totals(list), m = metas();
  const rest = m.kcal - t.kcal, C = 2 * Math.PI * 52, pct = Math.min(1, t.kcal / m.kcal);
  const macro = (nm, v, meta, color) => `<div class="macro"><div class="nm">${nm}</div>
    <div class="bar"><i style="width:${Math.min(100, meta ? v/meta*100 : 0)}%;background:var(--${color})"></i></div>
    <div class="vl">${Math.round(v)} <span class="muted">/ ${meta} g</span></div></div>`;
  let h = `<div class="datebar"><button class="icon-btn" data-a="day" data-d="-1" aria-label="Dia anterior">‹</button>
    <button class="date-lbl" data-a="dayToday">${dayLabel(d)}</button>
    <button class="icon-btn" data-a="day" data-d="1" aria-label="Próximo dia">›</button></div>`;
  if (!db.profile.configurado) h += `<div class="card note" data-a="tab" data-tab="perfil">Configure seu <b>perfil</b> para calcular sua meta de calorias →</div>`;
  h += `<div class="card"><div class="sum">
      <div class="ring"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" class="ring-bg"/>
        <circle cx="60" cy="60" r="52" class="ring-fg ${rest < 0 ? 'over' : ''}" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pct)}" transform="rotate(-90 60 60)"/></svg>
        <div class="ring-txt"><b>${Math.round(Math.abs(rest))}</b><span>${rest >= 0 ? 'kcal restantes' : 'kcal acima'}</span></div></div>
      <div class="sum-stats">
        <div><span class="muted small">Meta</span><b>${m.kcal}</b></div>
        <div><span class="muted small">Consumido</span><b>${Math.round(t.kcal)}</b></div>
        <div><span class="muted small">Restante</span><b class="${rest < 0 ? '' : 'accent'}" style="${rest < 0 ? 'color:var(--danger)' : ''}">${Math.round(rest)}</b></div>
      </div></div>
    <div class="macros">${macro('Proteína', t.p, m.prot, 'prot')}${macro('Carboidrato', t.c, m.carb, 'carb')}${macro('Gordura', t.g, m.gord, 'fat')}</div></div>`;
  for (const [k, label] of MEALS) {
    const items = list.filter(e => e.meal === k), mk = totals(items).kcal;
    h += `<div class="card meal"><div class="meal-h"><div><b>${label}</b> <span class="muted small">${items.length ? Math.round(mk) + ' kcal' : ''}</span></div>
      <button class="add-btn" data-a="addFood" data-meal="${k}" aria-label="Adicionar em ${label}">+</button></div>
      ${items.map(e => `<div class="li" data-a="editEntry" data-id="${e.id}"><div class="grow"><div>${esc(e.nome)}</div>
        <div class="muted small">${e.quick ? 'adição rápida' : fmt(e.gramas) + ' g'} · P ${fmt(e.p)} · C ${fmt(e.c)} · G ${fmt(e.g)}</div></div>
        <div class="kcal">${Math.round(e.kcal)}</div></div>`).join('')}</div>`;
  }
  if (!list.length && dayEntries(addDays(d, -1)).length) h += `<button class="btn block dashed" data-a="copyPrev">Copiar alimentos do dia anterior</button>`;
  return { title:'Dieta', html:h };
};

TABS.historico = () => {
  const m = metas();
  const days = []; for (let i = 6; i >= 0; i--) { const d = addDays(today(), -i); days.push({ d, v:totals(dayEntries(d)).kcal }); }
  const scale = Math.max(m.kcal, ...days.map(x => x.v)) * 1.1;
  const weekAgo = Date.now() - 7*864e5;
  const semana = db.sessions.filter(s => s.inicio >= weekAgo).length;
  let h = `<div class="card"><div class="row between"><div class="h3">Calorias — 7 dias</div><span class="muted small">--- meta ${m.kcal}</span></div>
    <div class="bars"><div class="meta-line" style="bottom:${m.kcal/scale*100*0.88}%"></div>
    ${days.map(x => `<div class="b"><small>${x.v ? Math.round(x.v) : ''}</small><i class="${x.v > m.kcal ? 'over' : ''}" style="height:${x.v/scale*88}%"></i></div>`).join('')}</div>
    <div class="bar-lbls">${days.map(x => `<span>${x.d === today() ? 'hoje' : parseYmd(x.d).toLocaleDateString('pt-BR', { weekday:'short' }).replace('.', '')}</span>`).join('')}</div></div>`;
  h += `<div class="card stat3"><div><b>${semana}</b><span>treinos (7 dias)</span></div><div><b>${db.sessions.length}</b><span>treinos no total</span></div>
    <div><b>${fmt(volume(db.sessions.filter(s => s.inicio >= weekAgo).flatMap(s => s.itens)) / 1000)}</b><span>toneladas (7 dias)</span></div></div>`;
  h += `<div class="section-title">Treinos realizados</div>`;
  if (!db.sessions.length) h += `<div class="empty">Nenhum treino finalizado ainda.</div>`;
  for (const s of [...db.sessions].reverse()) {
    const open = S.open[s.id], nSets = s.itens.reduce((a, it) => a + it.sets.length, 0);
    const dt = new Date(s.inicio).toLocaleDateString('pt-BR', { weekday:'short', day:'2-digit', month:'2-digit' });
    h += `<div class="card"><div data-a="histToggle" data-id="${s.id}">
      <div class="row between"><div class="h4">${esc(s.nome)}</div><span class="muted">${open ? '▴' : '▾'}</span></div>
      <div class="muted small">${dt} · ${dur(s.fim - s.inicio)} · ${nSets} séries · ${fmt(volume(s.itens))} kg</div></div>`;
    if (open) {
      h += s.itens.map(it => `<div class="li" data-a="progress" data-id="${it.exId}"><div class="grow"><div>${esc(it.nome)}</div>
        <div class="muted small">${it.sets.map(x => `${fmt(x.kg)}kg×${x.reps}`).join(' · ')}</div></div><span class="muted">📈</span></div>`).join('');
      h += `<button class="btn sm danger mt" data-a="histDel" data-id="${s.id}">Excluir registro</button>`;
    }
    h += `</div>`;
  }
  return { title:'Histórico', html:h };
};

function metaBoxHtml() {
  const m = metas(), manual = num(db.profile.metaManual) > 0;
  return `<div class="h3">Sua meta diária</div><div class="big accent">${m.kcal} kcal</div>
    <div class="kv"><span class="muted">Metabolismo basal (TMB)</span><b>${m.tmb} kcal</b></div>
    <div class="kv"><span class="muted">Gasto total estimado</span><b>${m.tdee} kcal</b></div>
    <div class="kv"><span class="muted">Ajuste do objetivo</span><b>${manual ? 'meta manual' : (m.ajuste > 0 ? '+' : '') + m.ajuste + ' kcal'}</b></div>
    <div class="tiles"><div class="tile"><b style="color:var(--prot)">${m.prot} g</b><span>Proteína</span></div>

function exListHtml() {
  const q = norm(S.q.trim());
  const list = db.exercises.filter(e => (S.grp === 'Todos' || e.grupo === S.grp) && (!q || norm(e.nome).includes(q)));
  if (!list.length) return `<div class="empty">Nenhum exercício encontrado.</div>`;
  let h = '', g = null;
  for (const e of [...list].sort((a, b) => GROUPS.indexOf(a.grupo) - GROUPS.indexOf(b.grupo) || a.nome.localeCompare(b.nome))) {
    if (e.grupo !== g) { if (g !== null) h += '</div>'; g = e.grupo; h += `<div class="group-h">${esc(g)}</div><div class="list">`; }
    h += `<div class="li ${S.pick.has(e.id) ? 'sel' : ''}" data-a="pickToggle" data-id="${e.id}"><span class="grow">${esc(e.nome)}</span><span class="tick">✓</span></div>`;
  }
  return h + '</div>';
}

PAGES.session = () => {
  const a = db.active;
  const done = a.itens.reduce((n, it) => n + it.sets.filter(s => s.done).length, 0);

  let h = `<div class="card stat3"><div><b id="elapsed">${dur(Date.now() - a.inicio)}</b><span>duração</span></div>
    <div><b>${done}/${total}</b><span>séries</span></div><div><b>${fmt(volume(a.itens.map(it => ({ sets:it.sets.filter(s => s.done) }))))}</b><span>kg volume</span></div></div>`;
  a.itens.forEach((it, i) => {
    const prev = lastSetsFor(it.exId);
    h += `<div class="card"><div class="row between gap"><div class="grow"><div class="h4">${esc(it.nome)}</div>
      <div class="muted small">${esc(it.grupo)}${it.alvo ? ' · alvo ' + esc(it.alvo) : ''} · descanso ${it.descanso}s</div></div>
      <button class="icon-btn" data-a="sessExDel" data-i="${i}" aria-label="Remover exercício">✕</button></div>
      ${prev ? `<div class="prev">Anterior: ${prev.map(s => `${fmt(s.kg)}×${s.reps}`).join(' · ')}</div>` : ''}
      <div class="sets"><div class="set-h"><span>Série</span><span>kg</span><span>Reps</span><span></span></div>
      ${it.sets.map((s, j) => `<div class="set ${s.done ? 'done' : ''}"><span class="n">${j+1}</span>
        <input class="inp" inputmode="decimal" data-in="set" data-i="${i}" data-j="${j}" data-k="kg" value="${esc(s.kg)}" placeholder="kg">
        <input class="inp" inputmode="numeric" data-in="set" data-i="${i}" data-j="${j}" data-k="reps" value="${esc(s.reps)}" placeholder="reps">

  });
  h += `<button class="btn block dashed" data-a="sessAddEx">+ Adicionar exercício</button>
    <button class="btn block primary" data-a="finishSession">Finalizar treino</button>
    <button class="btn block danger" data-a="cancelSession">Cancelar treino</button>`;
  return { title:a.nome, html:h, action:`<button class="link" data-a="finishSession">Finalizar</button>` };
};

PAGES.progress = (p) => {
  const ex = exById(p.exId) || { nome:'Exercício' };
  const rows = db.sessions.map(s => ({ s, it:s.itens.find(x => x.exId === p.exId) })).filter(x => x.it && x.it.sets.length)
    .map(({ s, it }) => { const best = it.sets.reduce((b, x) => num(x.kg) > num(b.kg) || (num(x.kg) === num(b.kg) && num(x.reps) > num(b.reps)) ? x : b, it.sets[0]);
      return { date:new Date(s.inicio), max:num(best.kg), best, vol:volume([it]), sets:it.sets }; });
  let h = '';

  if (rows.length) {
    const pr = rows.reduce((b, r) => r.max > b.max ? r : b, rows[0]);
    h += `<div class="card stat3"><div><b>${fmt(pr.max)}</b><span>recorde (kg)</span></div><div><b>${rows.length}</b><span>treinos</span></div><div><b>${fmt(rows[rows.length-1].max)}</b><span>último (kg)</span></div></div>`;

      <div class="muted small">${r.sets.map(x => `${fmt(x.kg)}×${x.reps}`).join(' · ')}</div></div><b>${fmt(r.max)} kg</b></div>`).join('')}</div>`;
  }

};

function lineChart(vals) {
  const W = 320, H = 150, L = 34, R = 10, T = 12, B = 16;
  const min = Math.min(...vals), max = Math.max(...vals), rng = (max - min) || 1;
  const x = (i) => L + (W - L - R) * (i / (vals.length - 1));
  const y = (v) => T + (H - T - B) * (1 - (v - min) / rng);
  const d = vals.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" class="chart">
    <line class="gl" x1="${L}" x2="${W-R}" y1="${y(max)}" y2="${y(max)}"/><line class="gl" x1="${L}" x2="${W-R}" y1="${y(min)}" y2="${y(min)}"/>
    <text class="ct" x="0" y="${y(max)+4}">${fmt(max)}</text><text class="ct" x="0" y="${y(min)+4}">${fmt(min)}</text>
    <path class="ln" d="${d}"/>${vals.map((v, i) => `<circle class="dt" cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="3.5"/>`).join('')}</svg>`;
}

function foodListHtml() {
  const q = norm(S.q.trim());
  if (q) {
    const list = db.foods.filter(f => norm(f.nome).includes(q)).sort((a, b) => norm(a.nome).indexOf(q) - norm(b.nome).indexOf(q) || a.nome.localeCompare(b.nome));

      : `<div class="empty">Nenhum alimento encontrado.<br>Toque em “Novo alimento” para cadastrar.</div>`;
  }
  const recent = [], seen = new Set();
  for (const d of Object.keys(db.diary).sort().reverse()) {
    for (const e of [...db.diary[d]].reverse()) {
      if (e.foodId && !seen.has(e.foodId)) { const f = db.foods.find(x => x.id === e.foodId); if (f) { seen.add(f.id); recent.push(f); } }
      if (recent.length >= 10) break;
    }
    if (recent.length >= 10) break;

  let h = '';
  if (recent.length) h += `<div class="group-h">Recentes</div><div class="list">${recent.map(foodItemHtml).join('')}</div>`;

}

/* ================= Render ================= */
function render() {
  let t = cur();
  if (t && t.type === 'session' && !db.active) { S.stack.pop(); t = cur(); }
  const r = t ? PAGES[t.type](t) : TABS[S.tab]();
  $('#title').textContent = r.title;
  $('#back').hidden = !t;
  $('#topAction').innerHTML = r.action || '';
  $('#view').innerHTML = r.html;
  document.body.classList.toggle('stacked', !!t);
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === S.tab));
  tickTimer();
}

/* ================= Timer de descanso ================= */
let AC = null;
function unlockAudio() {
  try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); } catch (e) {}
}
function beep() {
  if (!AC) return;
  [0, 0.28, 0.56].forEach(t => {
    const o = AC.createOscillator(), g = AC.createGain(), s = AC.currentTime + t;
    o.frequency.value = 880; o.connect(g); g.connect(AC.destination);
    g.gain.setValueAtTime(0.0001, s); g.gain.exponentialRampToValueAtTime(0.35, s + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, s + 0.22);
    o.start(s); o.stop(s + 0.25);
  });
}
function startRest(sec) { S.timer = { end:Date.now() + sec*1000, total:sec, fired:false }; tickTimer(); }
function tickTimer() {
  const box = $('#timer');
  document.body.classList.toggle('has-timer', !!S.timer);
  if (!S.timer) { box.hidden = true; return; }
  box.hidden = false;
  const left = S.timer.end - Date.now();
  if (left <= 0) {
    $('#tLeft').textContent = '0:00'; $('#tLabel').textContent = 'Bora! 💪'; $('#tProg').style.width = '100%';
    if (!S.timer.fired) {
      S.timer.fired = true; beep(); if (navigator.vibrate) navigator.vibrate([300, 100, 300]);
      const ref = S.timer; setTimeout(() => { if (S.timer === ref) { S.timer = null; tickTimer(); } }, 5000);
    }
    return;
  }
  $('#tLabel').textContent = 'Descanso';
  $('#tLeft').textContent = dur(left + 999);
  $('#tProg').style.width = (100 * (1 - left / (S.timer.total * 1000))) + '%';
}
setInterval(() => {
  if (db.active) { const txt = dur(Date.now() - db.active.inicio); for (const id of ['#elapsed', '#bannerElapsed']) { const el = $(id); if (el) el.textContent = txt; } }
  tickTimer();
}, 500);

/* ================= Ações ================= */
function newActive(w) {
  return { id:uid(), workoutId:w ? w.id : null, nome:w ? w.nome : 'Treino livre', inicio:Date.now(),
    itens: w ? w.itens.map(it => sessionItem(it.exId, num(it.series) || 3, it.reps, it.carga, num(it.descanso) || 60)) : [] };
}
function sessionItem(exId, n, reps, carga, descanso) {
  const ex = exById(exId) || { nome:'?', grupo:'' }, last = lastSetsFor(exId), alvo = String(reps || '');
  const sets = [];
  for (let j = 0; j < n; j++) {
    const l = last && (last[j] || last[last.length - 1]);
    sets.push({ kg: l ? l.kg : (carga || ''), reps: l ? l.reps : (parseInt(alvo) || ''), done:false });
  }
  return { exId, nome:ex.nome, grupo:ex.grupo, alvo, descanso, sets };
}

const A = {
  tab: (d) => { S.tab = d.tab; S.stack = []; render(); window.scrollTo(0, 0); },

  /* treinos */

  saveWorkout: () => {

  },

  },

  },

    if (db.active && !confirm('Já existe um treino em andamento. Descartar e iniciar este?')) return;

  },

  setDone: (d) => {
    unlockAudio();
    const it = db.active.itens[+d.i], s = it.sets[+d.j];
    s.done = !s.done;
    if (s.done) startRest(it.descanso);
    save(); render();
  },
  setAdd: (d) => { const it = db.active.itens[+d.i], l = it.sets[it.sets.length - 1] || {}; it.sets.push({ kg:l.kg || '', reps:l.reps || '', done:false }); save(); render(); },
  setDel: (d) => { db.active.itens[+d.i].sets.pop(); save(); render(); },

  sessAddEx: () => { S.pick = new Set(); S.q = ''; push({ type:'exPicker', mode:'session' }); },
  finishSession: () => {
    const a = db.active;
    const itens = a.itens.map(it => ({ exId:it.exId, nome:it.nome, grupo:it.grupo, sets:it.sets.filter(s => s.done).map(s => ({ kg:num(s.kg), reps:num(s.reps) })) })).filter(it => it.sets.length);

  histDel: (d) => { if (!confirm('Excluir este registro de treino?')) return; db.sessions = db.sessions.filter(s => s.id !== d.id); save(); render(); },

  day: (d) => { S.day = addDays(S.day, +d.d); render(); },
  dayToday: () => { S.day = today(); render(); },
  addFood: (d) => { S.q = ''; push({ type:'foodPicker', meal:d.meal }); },

  foodNew: () => push({ type:'foodEdit', id:null, meal:cur().meal }),
  quickAdd: () => push({ type:'quickAdd', meal:cur().meal }),
  editEntry: (d) => { const e = findEntry(d.id); push(e.quick ? { type:'quickAdd', entryId:e.id } : { type:'foodQty', entryId:e.id, g:null }); },
  qtySet: (d) => { cur().g = d.g; $('#qtyG').value = String(d.g).replace('.', ','); $('#qtyPrev').innerHTML = qtyPreviewHtml(qtySource(cur()).base, d.g); },
  qtySave: () => {
    const p = cur(), g = num($('#qtyG').value);
    if (g <= 0) return toast('Informe a quantidade');
    const src = qtySource(p), meal = $('#qtyMeal').value, v = calc(src.base, g);
    if (p.entryId) {
      Object.assign(findEntry(p.entryId), { meal, gramas:g, ...v }); save(); pop(); toast('Atualizado');
    } else {
      (db.diary[S.day] = db.diary[S.day] || []).push({ id:uid(), foodId:p.foodId, nome:src.nome, meal, gramas:g, base:src.base, porcao:src.porcao, ...v });
      save(); S.stack = []; S.tab = 'dieta'; render(); toast(`${src.nome} adicionado`);
    }
  },
  entryDel: () => {
    const id = cur().entryId; db.diary[S.day] = dayEntries(S.day).filter(e => e.id !== id); save(); pop(); toast('Removido');
  },
  quickSave: () => {
    const p = cur(), kcal = num($('#qKcal').value);
    if (kcal <= 0) return toast('Informe as calorias');
    const data = { nome:$('#qNome').value.trim() || 'Adição rápida', meal:$('#qMeal').value, kcal, p:num($('#qP').value), c:num($('#qC').value), g:num($('#qG').value), quick:true, gramas:null, foodId:null };
    if (p.entryId) { Object.assign(findEntry(p.entryId), data); save(); pop(); }
    else { (db.diary[S.day] = db.diary[S.day] || []).push({ id:uid(), ...data }); save(); S.stack = []; S.tab = 'dieta'; render(); }
    toast('Salvo');
  },
  copyPrev: () => {
    db.diary[S.day] = dayEntries(addDays(S.day, -1)).map(e => ({ ...clone(e), id:uid() }));
    save(); render(); toast('Alimentos copiados');
  },
  foodSave: () => {
    const p = cur(), nome = $('#fNome').value.trim();
    if (!nome) return toast('Digite o nome do alimento');
    const pn = $('#fPn').value.trim(), pg = num($('#fPg').value);
    const data = { nome, kcal:num($('#fKcal').value), p:num($('#fP').value), c:num($('#fC').value), g:num($('#fG').value), porcao: pn && pg > 0 ? { nome:pn, g:pg } : null };
    if (p.id) { Object.assign(db.foods.find(f => f.id === p.id), data); save(); pop(); toast('Alimento atualizado'); return; }
    const f = { id:uid(), custom:true, ...data }; db.foods.push(f); save();
    S.stack.pop(); push({ type:'foodQty', foodId:f.id, meal:p.meal, g:null }); toast('Alimento criado');
  },
  foodDel: () => {
    if (!confirm('Excluir este alimento da lista? O que já foi registrado no diário não muda.')) return;
    db.foods = db.foods.filter(f => f.id !== cur().id); save(); pop();
  },

  /* perfil / backup */
  export: async () => {
    const name = `fitdiario-backup-${today()}.json`;
    const file = new File([JSON.stringify(db)], name, { type:'application/json' });
    if (navigator.canShare && navigator.canShare({ files:[file] })) {
      try { await navigator.share({ files:[file], title:'Backup FitDiário' }); return; } catch (e) { if (e.name === 'AbortError') return; }
    }
    const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = name;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  },
  import: () => $('#importFile').click(),
  wipe: () => {
    if (!confirm('Apagar TODOS os dados (treinos, histórico, dieta e perfil)?')) return;
    if (!confirm('Tem certeza? Isso não pode ser desfeito. Recomendo exportar um backup antes.')) return;
    localStorage.removeItem(KEY); db = initialData(); save(); S.stack = []; render(); toast('Dados apagados');
  }
};

$('#importFile').addEventListener('change', async (e) => {
  const file = e.target.files[0]; e.target.value = '';
  if (!file) return;
  try {
    const d = JSON.parse(await file.text());
    if (!Array.isArray(d.exercises) || !Array.isArray(d.foods) || !d.profile) throw new Error();
    if (!confirm('Substituir todos os dados atuais pelos do backup?')) return;
    db = Object.assign(initialData(), d); save(); S.stack = []; render(); toast('Backup restaurado');
  } catch (err) { toast('Arquivo de backup inválido'); }
});

/* ================= Entradas de texto ================= */
const INPUTS = {
  draft: (el) => { S.draft[el.dataset.k] = el.value; },
  draftItem: (el) => { S.draft.itens[+el.dataset.i][el.dataset.k] = el.value; },
  set: (el) => { db.active.itens[+el.dataset.i].sets[+el.dataset.j][el.dataset.k] = el.value; save(); },
  exSearch: (el) => { S.q = el.value; $('#exList').innerHTML = exListHtml(); },
  foodSearch: (el) => { S.q = el.value; $('#foodList').innerHTML = foodListHtml(); },
  qty: (el) => { cur().g = el.value; $('#qtyPrev').innerHTML = qtyPreviewHtml(qtySource(cur()).base, el.value); },
  prof: (el) => {
    const k = el.dataset.k;
    let v = el.value;
    if (['idade', 'peso', 'altura', 'atividade', 'protKg', 'gordKg'].includes(k)) v = num(v);
    if (k === 'metaManual') v = v.trim() === '' ? '' : num(v);
    db.profile[k] = v; db.profile.configurado = true; save();
    $('#metaBox').innerHTML = metaBoxHtml();
  }
};
function onInput(e) {
  // 'change' só para <select>; em campos de texto ele dispara no blur e redesenharia a lista no meio de um toque
  if (e.type === 'change' && e.target.tagName !== 'SELECT') return;
  const k = e.target.dataset && e.target.dataset.in; if (k && INPUTS[k]) INPUTS[k](e.target, e);
}
document.addEventListener('input', onInput);
document.addEventListener('change', onInput);
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  const fn = A[el.dataset.a]; if (fn) { e.preventDefault(); fn(el.dataset, el, e); }
});

render();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
